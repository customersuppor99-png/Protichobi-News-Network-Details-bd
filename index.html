<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আন্তর্জাতিক সাংবাদিক আইডি ভেরিফিকেশন পোর্টাল - দৈনিক প্রতিচ্ছবি</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #060b19, #0a1128, #101f42);
            --glass-bg: rgba(13, 24, 48, 0.75);
            --glass-border: rgba(59, 130, 246, 0.25);
            --text-glow: 0 0 15px rgba(59, 130, 246, 0.6);
            --whatsapp-color: #25D366;
            --whatsapp-glow: 0 8px 25px rgba(37, 211, 102, 0.4);
            --neon-blue: #00f2fe;
            --neon-green: #4facfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #f1f5f9;
            overflow-x: hidden;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড ফ্লোটিং টেক-এলিমেন্টস অ্যানিমেশন */
        .tech-bg-element {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1));
            filter: blur(60px);
            z-index: 0;
            animation: floatingGlow 12s infinite alternate ease-in-out;
        }
        .el-1 { width: 400px; height: 400px; top: -10%; left: -10%; }
        .el-2 { width: 500px; height: 500px; bottom: -15%; right: -10%; animation-delay: 3s; }
        .el-3 { width: 300px; height: 300px; top: 40%; right: 15%; animation-delay: 6s; filter: blur(90px); background: rgba(37, 211, 102, 0.05); }

        @keyframes floatingGlow {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-50px) scale(1.15) rotate(45deg); }
        }

        /* মেইন রেসপনসিভ ফ্রেম */
        .wrapper {
            width: 100%;
            max-width: 620px;
            z-index: 1;
            opacity: 0;
            transform: translateY(40px);
            animation: entranceAnim 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes entranceAnim {
            to { opacity: 1; transform: translateY(0); }
        }

        /* প্রিমিয়াম গ্লাস কার্ড */
        .main-card {
            background: var(--glass-bg);
            border-radius: 28px;
            padding: 45px 40px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.1);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green), var(--whatsapp-color));
            border-radius: 28px 28px 0 0;
        }

        /* গ্লোবাল সাইবার হেডার */
        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); border-color: var(--neon-blue); }
            100% { box-shadow: 0 0 30px rgba(79, 172, 254, 0.6); border-color: var(--neon-green); }
        }

        .logo-container i {
            font-size: 34px;
            background: linear-gradient(to right, var(--neon-blue), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .brand-header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* সিকিউরিটি গাইডলাইন বক্স */
        .guideline-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 18px 22px;
            border-radius: 16px;
            font-size: 14.5px;
            color: #fde047;
            margin-bottom: 35px;
            line-height: 1.6;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .guideline-box i {
            font-size: 20px;
            margin-top: 2px;
            color: #fbbf24;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.4; }
        }

        /* ফর্ম কন্ট্রোল ও ইনপুট এলিমেন্টস */
        .form-group {
            margin-bottom: 26px;
        }

        .field-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 15.5px;
            color: #cbd5e1;
        }

        .field-title span {
            background: rgba(59, 130, 246, 0.2);
            color: var(--neon-blue);
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            color: #64748b;
            font-size: 17px;
            transition: all 0.3s;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 16px 16px 16px 52px;
            border: 1.5px solid rgba(226, 232, 240, 0.15);
            border-radius: 14px;
            font-size: 16px;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.4);
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(15, 23, 42, 0.7);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        input:focus + i {
            color: var(--neon-blue);
            transform: scale(1.1);
        }

        /* প্রফেশনাল রোবোটিক রেডিও বাটন ডিজাইন */
        .radio-container-box {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(226, 232, 240, 0.08);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 26px;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 12px;
        }

        .custom-radio {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(226, 232, 240, 0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-radio input {
            display: none;
        }

        .radio-dot {
            width: 16px;
            height: 16px;
            border: 2px solid #64748b;
            border-radius: 50%;
